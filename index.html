<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelBloom::Home</title>
        <link rel="stylesheet" href="./travel_recommendation.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

</head>
<body>
    <nav class="navbar">
        <!-- Logo -->
        <div class="nav-logo">
        <i class="fa fa-airplane logo-icon"></i>
          <span class="logo-text">TravelBloom</span>
        </div>
    
        <!-- Navigation Links -->
        <ul class="nav-links">
          <li><a href="./index.html">Home</a></li>
          <li><a href="./travel_recommendation_about.html">About Us</a></li>
          <li><a href="./travel_recommendation_contact.html">Contact Us</a></li>
        </ul>
    
        <!-- Search -->
        <div class="nav-search">
          <input type="text" id="searchInput" placeholder="Enter a destination or keyword" />
          <div class="nav-buttons">
              <button type="button" class="btn search-btn">Search</button>
              <button type="button" class="btn clear-btn">Clear</button>
          </div>
        </div>
    </nav>
    <section class="section">
            <div class="searchResult">
                <div id="result" class="results"></div>
            </div>
            <div class="container">
                <div class="hero_icons">
                    <div class="line_container">

                        <span class="icon_line"></span>
                    </div>
                    <div class="icon_container">
                        <i class="fa-brands fa-twitter"></i>
                        <i class="fa-brands fa-facebook-f"></i>
                        <i class="fa-brands fa-instagram"></i>
                        <i class="fa-brands fa-youtube"></i>
                    </div>
                </div>
                <div class="hero-content">
                    <h1 class="hero-heading">
                      Explore <br>
                      Dream <br>
                      Destination
                    </h1>
                    <p class="hero-description">
                      It encourages exploration of unfamiliar territories, embraces diverse
                      cultures and landscapes, while pursuing the desired destination that
                      captivates the heart and ignites a sense of wonder.
                    </p>
                    <button type="button" class="hero-button">Book Now</button>
                  </div>
            </div>
        </section>
        <script src="./travel_recommendation.js"></script>
</body>
</html>
