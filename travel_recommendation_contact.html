<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelBloom::Contact</title>
    <link rel="stylesheet" href="travel_recommendation_contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
</head>
<body>
        <nav class="navbar">
        <!-- Logo -->
        <div class="nav-logo">
        <i class="fa fa-airplane logo-icon"></i>
          <span class="logo-text">TravelBloom</span>
        </div>
    
        <!-- Navigation Links -->
        <ul class="nav-links">
          <li><a href="./index.html">Home</a></li>
          <li><a href="./travel_recommendation_about.html">About Us</a></li>
          <li><a href="./travel_recommendation_contact.html">Contact Us</a></li>
        </ul>

        <!-- search buttons -->
        <div class="search"></div>
    </nav>
       <section class="section">
        <div class="container">
            <div class="hero_icons">
                <div class="line_container">

                    <span class="icon_line"></span>
                </div>
                <div class="icon_container">
                    <i class="fa-brands fa-twitter"></i>
                    <i class="fa-brands fa-facebook-f"></i>
                    <i class="fa-brands fa-instagram"></i>
                    <i class="fa-brands fa-youtube"></i>
                </div>
            </div>
        </section>
        <section class="contact_section">
            <aside class="contact_card">
                <div class="contact_head">
                         <h1>Contact Us</h1>
                         <p>Get in touch</p>
                </div>
                <div class="contact_form">
                    <form id="contactForm">
                        <div>
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div>
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div>
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" onclick="thankyou()">Submit</button>
                    </form>
                </div>
            </aside>
        </section>
        <script>
            function thankyou(){
                alert('Thank you for contacting us!')
            }
        </script>
</body>
</html>
